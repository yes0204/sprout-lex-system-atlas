<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sprout Lex · 실행 기록 따라가기</title>
<style>body{margin:0;background:#f7f9f9;font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}main{max-width:1080px;margin:0 auto;padding:20px 16px 60px}h1{font-size:18px;color:#192e35;margin:8px 0 2px}.sub{color:#65757b;font-size:12px;margin:0 0 12px}.back{font-size:12px;color:#147360}.fail{color:#8f2020;font-size:13px}</style>
</head>
<body>
<main>
<p><a class="back" href="./">← 시스템 보드로</a></p>
<h1>실행 기록 따라가기</h1>
<p class="sub">실제 질문이 어디까지 갔는지의 기록이다. 개발판 관측이며 실시간이 아니다. 이 화면은 기록을 그릴 뿐 질문을 다시 실행하거나 모델을 호출하지 않는다.</p>
<div id="runs-review-root"></div>
<noscript><p class="fail">이 화면은 스크립트가 켜져 있어야 보인다.</p></noscript>
</main>
<script>
/* 데이터·화면 코드를 매번 새로 받는다(캐시로 낡은 기록이 보이지 않게). 외부 주소 호출 없음 — 같은 폴더의 두 파일뿐이다. */
(function () {
  var root = document.getElementById('runs-review-root'), stamp = Date.now();
  function load(src, next) {
    var s = document.createElement('script'); s.src = src + '?t=' + stamp;
    s.onload = next;
    s.onerror = function () { root.textContent = '기록 파일을 불러오지 못했다: ' + src; root.className = 'fail'; };
    document.body.appendChild(s);
  }
  load('runs-review-data.js', function () { load('runs-review.js', function () { window.RunsReview.mount(root); }); });
})();
</script>
</body>
</html>
